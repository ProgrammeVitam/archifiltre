[package]
name = "archifiltre-ui"
version = "5.0.0"
description = "Archifiltre Desktop UI"
authors = ["Archifiltre Team"]
license = "Apache-2.0"
repository = "https://github.com/ProgrammeVitam/archifiltre"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = ">=2.11.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["sync", "process", "io-util"] }
uuid = { version = "1", features = ["v4"] }

# Native window effects — vibrancy on macOS, acrylic on Windows. Not pulled on Linux
# (window-vibrancy has no Linux backend); Linux keeps the translucent look + the CSS
# "solid" fallback controlled from Settings.
[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.7.1"

[target."cfg(target_os = \"windows\")".dependencies]
window-vibrancy = "0.7.1"

# Test-only: a multi-thread runtime for the owner integration test (built manually,
# no macros feature). Merged into the existing tokio dep for tests; no release impact.
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
