name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BUN_VERSION: '1.0.0'
  NODE_VERSION: '18'

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run ESLint
        run: bun run lint

      - name: Type checking
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:unit --reporter=verbose

      - name: Run integration tests
        run: bun run test:integration --reporter=verbose

      - name: Generate test coverage
        run: bun run test -- --coverage --reporter=verbose

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: success()
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    env:
      APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-{0}', github.sha) }}
      GIT_SHA: ${{ github.sha }}
      BUILD_DATE: ${{ github.event.head_commit.timestamp || github.event.commits[0].timestamp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set build environment
        run: |
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")" >> $GITHUB_ENV

      - name: Build CLI binary
        run: bun run build:cli

      - name: Verify binary exists
        run: |
          ls -la archifiltre
          file archifiltre
          chmod +x archifiltre

      - name: Test binary execution
        run: |
          ./archifiltre --version
          ./archifiltre --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v3
        with:
          name: archifiltre-linux-x64-${{ github.run_number }}
          path: archifiltre
          retention-days: 7

  compatibility:
    name: Compatibility Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['18', '20']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ matrix.node-version }}-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ matrix.node-version }}-
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quick tests
        run: bun run test:unit --run

      - name: Test build compatibility
        run: |
          bun run build:cli
          chmod +x archifiltre* || true
          ./archifiltre* --version || ./archifiltre*.exe --version

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Security audit
        run: |
          # Bun audit when available, for now check for known vulnerabilities
          echo "Running security checks..."

          # Check for common security issues in dependencies
          if [ -f "bun.lockb" ]; then
            echo "Lockfile present - good for security"
          else
            echo "Warning: No lockfile found"
            exit 1
          fi

          # Verify no sensitive files are committed
          if find . -name "*.key" -o -name "*.pem" -o -name ".env" -o -name "*.env" | grep -v node_modules | grep -q .; then
            echo "Warning: Potential sensitive files found"
            find . -name "*.key" -o -name "*.pem" -o -name ".env" -o -name "*.env" | grep -v node_modules
            exit 1
          fi

      - name: Check for secrets
        run: |
          # Basic secret detection
          if grep -r -i "password\|secret\|key\|token" src/ --exclude-dir=node_modules | grep -v "// " | grep -v "* " | grep -q .; then
            echo "Potential secrets found in source code:"
            grep -r -i "password\|secret\|key\|token" src/ --exclude-dir=node_modules | grep -v "// " | grep -v "* " || true
            echo "Please review and ensure no actual secrets are committed."
          fi

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, build]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "Lint and Format: ${{ needs.lint-and-format.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"

          if [ "${{ needs.lint-and-format.result }}" != "success" ]; then
            echo "❌ Lint and format checks failed"
            exit 1
          fi

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi

          echo "✅ All quality gates passed!"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [quality-gates]
    if: always() && (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Notification
        run: |
          if [ "${{ needs.quality-gates.result }}" == "success" ]; then
            echo "🎉 CI passed for main branch!"
          else
            echo "❌ CI failed for main branch"
            exit 1
          fi
